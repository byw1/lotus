name: Bug report
description: Something on the site is broken.
labels: ["bug"]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you expect, and what happened instead?
    validations:
      required: true
  - type: input
    id: url
    attributes:
      label: Page URL
      placeholder: https://lotusfestivalla.com/vendors
  - type: input
    id: env
    attributes:
      label: Browser and device
      placeholder: Safari 18 on iPhone 15
  - type: textarea
    id: extra
    attributes:
      label: Screenshots or console output
