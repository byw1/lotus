name: Idea or improvement
description: Suggest something for the festival site.
labels: ["enhancement"]
body:
  - type: textarea
    id: idea
    attributes:
      label: What would you like to see?
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Who does it help?
      description: Festival visitors, vendors, performers, volunteers, staff?
